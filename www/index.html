<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>TS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0a0a;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0 0 56px 0;padding-top:env(safe-area-inset-top,0)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0a0a;display:none}
iframe.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0));padding-bottom:env(safe-area-inset-bottom,0);display:grid;grid-template-columns:repeat(4,1fr);background:#111;border-top:1px solid #2a2a2a;z-index:10}
nav button{background:none;border:0;color:#8a8a8a;font:600 11px/1 inherit;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}
nav button.on svg{stroke-width:2.3}
@media(prefers-color-scheme:light){html,body,iframe{background:#f4f4f5}nav{background:#fff;border-top-color:#e6e6e8}nav button{color:#6f6f73}nav button.on{color:#0a0a0a}}
</style></head>
<body>
<div id="stage"></div>
<nav>
 <button data-t="today"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Today</button>
 <button data-t="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Goals</button>
 <button data-t="trading"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg>Trading</button>
 <button data-t="berserker"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M4 9l5-5M15 20l5-5M3 21l3-3M18 6l3-3"/></svg>Berserker</button>
</nav>
<script>
var APPS={today:'apps/today/index.html',goals:'apps/goals/index.html',trading:'apps/trading/index.html',berserker:'apps/berserker/index.html'};
var stage=document.getElementById('stage'),frames={},cur='today';
function ensure(t){
  if(!frames[t]){var f=document.createElement('iframe');f.src=APPS[t];f.setAttribute('allow','autoplay');stage.appendChild(f);frames[t]=f;return true}
  return false;
}
function show(t){
  if(!APPS[t])t='today';
  cur=t;
  if(!ensure(t)&&t==='today'){try{frames.today.contentWindow.postMessage({hubRefresh:1},'*')}catch(e){}}
  for(var k in frames)frames[k].classList.toggle('on',k===t);
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  try{localStorage.setItem('hub.tab',t)}catch(e){}
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
window.addEventListener('message',function(e){if(e.data&&e.data.hubGo)show(e.data.hubGo)});
var last='today';try{last=localStorage.getItem('hub.tab')||'today'}catch(e){}
show(last);
// load Goals in the background so study reminders get scheduled on every launch
setTimeout(function(){ensure('goals')},1200);
// Android back button: go to Today first, exit only from Today
try{var AP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(AP)AP.addListener('backButton',function(){if(cur!=='today')show('today');else AP.exitApp()})}catch(e){}
</script>
</body></html>
