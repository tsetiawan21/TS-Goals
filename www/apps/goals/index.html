<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Future Goals</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--fg:#0a0a0a;--dim:#6f6f73;--line:#e6e6e8;--fill:#efeff1;--on:#fff;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -14px rgba(0,0,0,.14);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#141415;--fg:#f4f4f5;--dim:#8e8e93;--line:#262628;--fill:#1d1d1f;--on:#0a0a0a;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.in:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#top{display:flex;gap:2px;margin:12px 16px 4px;padding:3px;background:var(--fill);border-radius:12px;flex:none}
#top button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;color:var(--dim);font-weight:600;font-size:13.5px}
#top button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
#view{flex:1;overflow-y:auto;padding:4px 16px 40px;max-width:560px;width:100%;margin:0 auto}
.dim{color:var(--dim)}.fg{color:var(--fg)}.sm{font-size:12.5px}.center{text-align:center}.tn{font-variant-numeric:tabular-nums}
p{margin:0}
.greet{padding:18px 4px 14px}.greet h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em}.greet p{color:var(--dim);margin-top:2px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ch h2{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ic{width:17px;height:17px;fill:none;stroke:var(--dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:4px}
.tag{font-size:12px;color:var(--dim);font-weight:600;font-style:normal;font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:var(--fill);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.chip.solid{background:var(--fg);border-color:var(--fg);color:var(--on)}
.note{color:var(--dim);font-size:13px;margin:10px 0 0}
.lbl{font-size:12px;color:var(--dim);font-weight:500;margin:0 0 7px}.lbl.mt{margin-top:16px}
/* hero */
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px}
.num{font-size:42px;line-height:1.05;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.num small{font-size:17px;font-weight:600;color:var(--dim);letter-spacing:0;margin:0 5px 0 2px}
.cap{color:var(--dim);font-size:13px;margin-top:6px}
.mini{width:72px;height:72px;flex:none}
.mini text{fill:var(--fg);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.rt,.rp{fill:none;stroke-width:6}.rt{stroke:var(--fill)}.rp{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.kv b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kv span{color:var(--dim);font-size:12.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpis .card{margin:0 0 12px;display:flex;flex-direction:column;gap:12px}
.bar{height:6px;border-radius:6px;background:var(--fill);overflow:hidden}.bar b{display:block;height:100%;background:var(--fg);border-radius:6px;transition:width .5s ease}
.grps{margin-top:18px;display:grid;gap:14px}.gl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
/* next + strip + rows */
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--fill);border-radius:12px;padding:12px 14px}
.next b{font-size:15px;font-weight:600}.next .tn{font-weight:600;font-size:13px}
.strip{position:relative;height:28px;margin:16px 0 6px}.strip i{position:absolute;top:0;bottom:0}
.strip .free{background:var(--fill);border:1px solid var(--line);border-radius:7px}
.strip .blk{top:6px;bottom:6px;background:var(--fg);border-radius:4px}
.strip u{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--fg);border-radius:2px;box-shadow:0 0 0 2px var(--card)}
.ticks{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.rows{margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.rows .row:first-child{border-top:0}.row.past{opacity:.5}.row.hist{align-items:center}.right{text-align:right}
.dots{display:inline-flex;gap:3px;margin-top:5px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--fg)}
/* 7-day chart */
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:120px}
.bc{display:flex;flex-direction:column;gap:8px;min-height:0}
.bt{flex:1;display:flex;align-items:flex-end;background:var(--fill);border-radius:8px;overflow:hidden}
.bt i{display:block;width:100%;background:var(--dim);opacity:.55;border-radius:8px}.bt i.today{background:var(--fg);opacity:1}
.bc span{text-align:center;font-size:11px;color:var(--dim);font-weight:600}.bc span.fg{color:var(--fg)}
/* controls */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;max-width:100%}
.seg button{border:0;background:none;color:var(--dim);padding:7px 11px;border-radius:8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.16)}
@media(prefers-color-scheme:dark){.seg button.on{background:var(--fg);color:var(--on);box-shadow:none}#top button.on{background:var(--fg);color:var(--on);box-shadow:none}}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.pill{border:1px solid var(--line);background:none;color:var(--dim);padding:7px 12px;border-radius:999px;font-weight:500;font-size:13px}
.pill.on{background:var(--fg);border-color:var(--fg);color:var(--on)}
.btn{flex:1;height:50px;border-radius:13px;border:1px solid var(--fg);background:var(--fg);color:var(--on);font-weight:600;font-size:15.5px}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.btn.text{flex:none;height:auto;border:0;background:none;color:var(--dim);font-size:13px;padding:10px 12px;text-decoration:underline;text-underline-offset:3px}
.btn:active,.pill:active,.seg button:active,.opt:active{opacity:.7}
.actions{display:flex;gap:10px;margin-top:18px}
.in{width:100%;background:var(--fill);border:1px solid transparent;border-radius:11px;padding:12px 13px;color:var(--fg);font:inherit}
textarea.in{min-height:104px;resize:none;margin:14px 0 0}.in::placeholder{color:var(--dim)}
.tf span{display:block;color:var(--dim);font-size:12px;margin-bottom:5px;font-weight:500}
.tfs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:none;border-radius:11px;padding:11px 13px;font-size:14px}
.opt span{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--dim);flex:none}
.opt.on{border-color:var(--fg)}.opt.on span{background:var(--fg);color:var(--on);border-color:var(--fg)}
/* planner */
details.cfg{padding:0}details.cfg>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:600;font-size:14px;cursor:pointer}
details.cfg>summary::-webkit-details-marker{display:none}details.cfg>summary span{flex:1}
details.cfg>summary::after{content:"+";color:var(--dim);font-weight:400;font-size:20px;line-height:1}
details.cfg[open]>summary::after{content:"\2212"}
details.cfg>:not(summary){margin-left:18px;margin-right:18px}details.cfg>.actions{margin-bottom:18px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dn{display:flex;align-items:baseline;gap:7px}.dn b{font-weight:700;font-size:16px}.dn span{color:var(--dim);font-size:13px}
.dn .tag{background:var(--fill);border-radius:999px;padding:2px 8px}
/* timer */
.dialcard{text-align:center}
.dial{position:relative;width:240px;height:240px;margin:8px auto 4px}.ring{width:100%;height:100%;display:block}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#clk{font-size:44px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#clkl{color:var(--dim);font-size:13px;margin-top:2px;font-weight:500}
/* road */
.weeks{display:grid;gap:6px;margin:18px 0 14px}
.wr{display:grid;grid-template-columns:14px repeat(14,1fr);gap:6px;align-items:center}
.wr em{font-style:normal;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.w{display:block;aspect-ratio:1;border-radius:50%;background:var(--fg)}
.w.f{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.w.cur{outline:2px solid var(--fg);outline-offset:2px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}.legend .w{width:10px;flex:none}
.chart.wk{height:130px;gap:8px}.chart.wk .bt{position:relative}.chart.wk .bt u{position:absolute;left:-2px;right:-2px;height:0;border-top:1px dashed var(--dim)}
.sub{display:flex;align-items:center;gap:10px;margin-top:6px}.sub .dots{margin-top:0}.nt{margin-top:2px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls{display:block;font-size:12.5px;margin-top:1px}
details.blk{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--bg)}
details.blk>summary{list-style:none;padding:13px 14px;cursor:pointer}details.blk>summary::-webkit-details-marker{display:none}
details.blk[open]{border-color:var(--fg)}details.blk>.lb,details.blk>.actions{margin-left:14px;margin-right:14px}details.blk>.actions{margin-bottom:14px}
.b1{display:flex;justify-content:space-between;color:var(--dim);font-size:12.5px;margin-bottom:3px}.bs b{font-size:15px;font-weight:600;display:block;line-height:1.3}
.lb p{margin:0 0 4px;font-size:14px}.lh{font-size:12px;color:var(--dim);font-weight:600;margin:14px 0 5px}
.bl{margin:0;padding-left:18px;font-size:14px}.bl li{margin:3px 0}.bl.st{padding-left:20px}.bl.st li{margin:7px 0}
details.syl{padding:0}details.syl>summary{list-style:none;padding:16px 18px;cursor:pointer}details.syl>summary::-webkit-details-marker{display:none}
.sy1 b{display:block;font-size:15px;margin-bottom:2px}.sy1 .bar{margin-top:10px}
details.ln{border-top:1px solid var(--line);padding:0 18px}details.ln>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 0;cursor:pointer}
details.ln>summary::-webkit-details-marker{display:none}.lt{flex:1;font-size:14px}details.ln>summary .chip{min-width:62px;text-align:center}
details.ln>.actions{margin-bottom:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div id="top"><button data-v="home">Home</button><button data-v="planner">Planner</button><button data-v="timer">Timer</button><button data-v="stats">Stats</button></div>
<div id="view"></div>
<script src="curriculum.js"></script>
<script src="app.js"></script>
</body></html>
