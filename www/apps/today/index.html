<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Today</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--fg:#0a0a0a;--dim:#6f6f73;--line:#e6e6e8;--fill:#efeff1;--on:#fff;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -14px rgba(0,0,0,.14);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#141415;--fg:#f4f4f5;--dim:#8e8e93;--line:#262628;--fill:#1d1d1f;--on:#0a0a0a;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#v{height:100%;overflow-y:auto;padding:4px 16px 40px;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;text-align:left}
p{margin:0}.dim{color:var(--dim)}.tn{font-variant-numeric:tabular-nums}
.greet{padding:22px 4px 14px}.greet h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em}.greet p{color:var(--dim);margin-top:2px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px}
.eyebrow{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:4px}
.big{font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.035em}.big small{font-size:17px;color:var(--dim);font-weight:600;letter-spacing:0;margin-left:4px}
.cap{color:var(--dim);font-size:13px;margin-top:6px}
.mini{width:76px;height:76px;flex:none}.rt,.rp{fill:none;stroke-width:6}.rt{stroke:var(--fill)}.rp{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.mini text{fill:var(--fg);font-size:15px;font-weight:700}
.pil{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.pil:active{opacity:.7}
.ico{width:42px;height:42px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pil .t{flex:1;min-width:0}.pil b{font-size:15px;font-weight:600}.pil .m{color:var(--dim);font-size:13px;margin-top:2px}
.chip{border:1px solid var(--line);background:var(--fill);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.done{background:var(--fg);border-color:var(--fg);color:var(--on)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ch h2{margin:0;font-size:14px;font-weight:600}.tag{font-size:12px;color:var(--dim);font-weight:600}
.hg{display:grid;grid-template-columns:64px repeat(7,1fr) 34px;gap:8px 6px;align-items:center}
.hg .h{font-size:11px;color:var(--dim);text-align:center;font-weight:600}.hg .h.now{color:var(--fg)}
.hg .n{font-size:13px;font-weight:500}.hg .s{font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.d{display:block;aspect-ratio:1;border-radius:50%;background:var(--fg);max-width:22px;width:100%;margin:0 auto}
.d.n0{background:none;box-shadow:inset 0 0 0 1px var(--line)}.d.n1{opacity:.4}
.note{color:var(--dim);font-size:12.5px;margin-top:14px}
.btn{flex:1;height:48px;border-radius:13px;border:1px solid var(--fg);background:var(--fg);color:var(--on);font-weight:600;font-size:15px;text-align:center}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}.btn:active{opacity:.7}
.acts{display:flex;gap:10px;margin-top:12px}.nag{border-color:var(--fg)}.nag b{font-size:15px}.nag p{margin:4px 0 0;font-size:13px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--dim);padding:7px 10px;border-radius:8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.16)}
@media(prefers-color-scheme:dark){.seg button.on{background:var(--fg);color:var(--on);box-shadow:none}}
#toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--fg);color:var(--on);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:500;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:528px;margin:0 auto}
#toast.on{opacity:1;transform:none}
</style></head><body>
<div id="v"></div><div id="toast"></div>
<script>
(function(){
'use strict';
var STUDY_DONE_MIN=60; // minutes of study that count as a done day (changeable in Settings)
var p2=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var fmtDur=function(m){return Math.floor(m/60)+'h '+p2(m%60)+'m'};
function rd(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function load(){
  if(window.__DEMO__)return window.__DEMO__;
  return {G:rd('futuregoals.v1'),T:rd('trading-routine-tracker.v1'),BH:rd('apex_history'),BP:rd('apex_profile')};
}
// Berserker stamps entry.date in UTC; the id ends with Date.now(), which gives the true local day.
function berserkerDay(e){var ts=Number(String(e.id||'').split('-').pop());return ts>1e12?dkey(new Date(ts)):e.date}
function facts(D,k){
  var f={};
  var sess=((D.G&&D.G.sessions)||[]).filter(function(s){return dkey(new Date(s.started_at))===k});
  var m=Math.round(sess.reduce(function(a,s){return a+s.duration_ms},0)/60000);
  f.study={min:m,n:sess.length,lvl:m>=STUDY_DONE_MIN?2:m>0?1:0};
  var ws=((D.BH)||[]).filter(function(e){return berserkerDay(e)===k});
  f.train={n:ws.length,xp:ws.reduce(function(a,e){return a+(e.xpGained||0)},0),name:ws.length?ws[ws.length-1].name:'',lvl:ws.length?2:0};
  var T=D.T,tr=T?(T.trades||[]).filter(function(t){return t.date===k&&t.status!=='cancelled'}):[],dy=T&&T.days&&T.days[k]||{};
  var cl=tr.filter(function(t){return t.status==='closed'});
  var r=cl.reduce(function(a,t){return a+(typeof t.r==='number'?t.r:0)},0);
  var rules=cl.length?Math.round(cl.reduce(function(a,t){return a+(t.rules==null?1:t.rules)},0)/cl.length*100):null;
  f.trade={n:tr.length,closed:cl.length,r:r,rules:rules,plan:!!dy.planReady,dayClosed:!!dy.closed,lvl:(dy.closed||cl.length)?2:(dy.planReady||tr.length)?1:0};
  return f;
}
function streak(D,pillar,from){
  var n=0,d=new Date(from);
  if(facts(D,dkey(d))[pillar].lvl<(pillar==='study'?2:2)){d=addDays(d,-1)}
  for(var i=0;i<120;i++){if(facts(D,dkey(d))[pillar].lvl>=2){n++;d=addDays(d,-1)}else break}
  return n;
}
var IC={study:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',train:'<path d="M6.5 6.5l11 11M4 9l5-5M15 20l5-5M3 21l3-3M18 6l3-3"/>',trade:'<path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/>'};
function ring(n){var r=28,c=2*Math.PI*r;return '<svg class="mini" viewBox="0 0 68 68"><circle cx="34" cy="34" r="'+r+'" class="rt"/><circle cx="34" cy="34" r="'+r+'" class="rp" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-n/3)+'" transform="rotate(-90 34 34)"/><text x="34" y="39" text-anchor="middle">'+n+'/3</text></svg>'}
function render(){
  if(!window.__DEMO__){var cs=rd('hub.settings.v1');STUDY_DONE_MIN=(cs&&cs.studyMin)||60}
  var D=load(),now=new Date(),k=dkey(now),f=facts(D,k),hr=now.getHours();
  var done=(f.study.lvl>=2)+(f.train.lvl>=2)+(f.trade.lvl>=2);
  var chip=function(l){return '<span class="chip'+(l>=2?' done':'')+'">'+(l>=2?'Done':l===1?'In progress':'Not started')+'</span>'};
  var sS=streak(D,'study',now),sT=streak(D,'train',now),sR=streak(D,'trade',now);
  var trM=f.trade.n?(f.trade.n+' trade'+(f.trade.n>1?'s':'')+', '+(f.trade.r>=0?'+':'')+f.trade.r.toFixed(1)+'R'+(f.trade.rules!=null?', rules '+f.trade.rules+'%':'')):f.trade.plan?'Plan ready, no trades yet':'No plan or trades yet';
  var rows=[
   ['study','Study',f.study.min?fmtDur(f.study.min)+' in '+f.study.n+' session'+(f.study.n>1?'s':''):'Nothing logged yet',f.study.lvl,'goals'],
   ['train','Training',f.train.n?(f.train.name||'Workout')+', +'+f.train.xp+' XP':'No workout logged'+(D.BP&&D.BP.streak?'. Streak '+D.BP.streak+' days':''),f.train.lvl,'berserker'],
   ['trade','Trading',trM,f.trade.lvl,'trading']];
  var days=[];for(var i=6;i>=0;i--){days.push(addDays(now,-i))}
  var full=0,cells={study:'',train:'',trade:''};
  days.forEach(function(d){var x=facts(D,dkey(d));if(x.study.lvl>=2&&x.train.lvl>=2&&x.trade.lvl>=2)full++;
    ['study','train','trade'].forEach(function(p){cells[p]+='<i class="d n'+x[p].lvl+'"></i>'})});

  var last=Number(localStorage.getItem('hub.lastBackup')||0),ageD=last?Math.floor((Date.now()-last)/864e5):null;
  var hasData=((D.G&&D.G.sessions||[]).length+(D.BH||[]).length+((D.T&&D.T.trades)||[]).length)>0;
  var nag=(!window.__DEMO__&&hasData&&(!last||ageD>=7))?'<section class="card nag"><b>'+(last?'Last backup was '+ageD+' days ago':'No backup yet')+'</b><p class="dim">Your data lives only on this phone. A backup protects it if you reinstall the app or lose the phone.</p><div class="acts"><button class="btn" data-do="export">Back up now</button></div></section>':'';
  var extra='<section class="card"><div class="ch"><h2>Settings</h2></div><div class="row2"><span>Study counts as done at</span><div class="seg">'+[30,45,60,90].map(function(m){return '<button class="'+(m===STUDY_DONE_MIN?'on':'')+'" data-min="'+m+'">'+m+'m</button>'}).join('')+'</div></div></section>'+
   '<section class="card"><div class="ch"><h2>Backup and tools</h2><span class="tag">'+(last?'Last: '+new Date(last).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'Never backed up')+'</span></div><div class="acts" style="margin-top:0"><button class="btn" data-do="export">Export backup</button><button class="btn ghost" data-do="import">Restore</button></div><div class="acts"><button class="btn ghost" data-do="notif">Test notification</button></div><p class="note">Export opens the share sheet: save the file to Drive, email it, or send it to yourself. Restore replaces all data in the app with a backup file.</p><input type="file" id="imp" accept=".json,application/json" hidden></section>';
  var head='<span></span>'+days.map(function(d,i){return '<span class="h'+(i===6?' now':'')+'">'+d.toLocaleDateString('en-GB',{weekday:'narrow'})+'</span>'}).join('')+'<span></span>';
  var gridRow=function(n,p,s){return '<span class="n">'+n+'</span>'+cells[p]+'<span class="s">'+s+'d</span>'};
  document.getElementById('v').innerHTML=
   '<div class="greet"><h1>'+(hr<12?'Good morning':hr<18?'Good afternoon':'Good evening')+'</h1><p>'+now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'</p></div>'+nag+
   '<section class="card hero"><div><div class="eyebrow">Today</div><div class="big">'+done+'<small>of 3 done</small></div><div class="cap">'+(done===3?'Study, training and trading are all done.':done===0?'Nothing logged yet today.':(3-done)+' left today.')+'</div></div>'+ring(done)+'</section>'+
   rows.map(function(r){return '<button class="pil" data-go="'+r[5]+'"><span class="ico"><svg viewBox="0 0 24 24">'+IC[r[0]]+'</svg></span><span class="t"><b>'+r[1]+'</b><div class="m">'+r[2]+'</div></span>'+chip(r[3])+'</button>'}).join('')+
   '<section class="card"><div class="ch"><h2>Last 7 days</h2><span class="tag">'+full+' full day'+(full===1?'':'s')+'</span></div><div class="hg">'+head+gridRow('Study','study',sS)+gridRow('Training','train',sT)+gridRow('Trading','trade',sR)+'</div>'+
   '<p class="note">Solid means done, faint means started. Study counts as done at '+STUDY_DONE_MIN+' minutes. The number on the right is each current streak.</p></section>'+extra;
  bind();
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){try{parent.postMessage({hubGo:b.dataset.go},'*')}catch(e){}}});
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},3200)}
function plug(n){try{var C=window.parent&&window.parent.Capacitor||window.Capacitor;return C&&C.Plugins&&C.Plugins[n]||null}catch(e){return null}}
function snapshot(){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);o[k]=localStorage.getItem(k)}return{app:'ts-backup',v:1,at:new Date().toISOString(),data:o}}
async function doExport(){
  var json=JSON.stringify(snapshot()),name='ts-backup-'+dkey(new Date())+'.json',FS=plug('Filesystem'),SH=plug('Share');
  try{
    if(FS&&SH){var r=await FS.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});await SH.share({title:'TS backup',text:'TS data backup',url:r.uri,dialogTitle:'Save your TS backup'})}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
    localStorage.setItem('hub.lastBackup',String(Date.now()));toast('Backup exported. Keep the file somewhere safe.');render();
  }catch(e){toast('Export did not finish. Try again.')}
}
function doImport(f){
  if(!f)return;var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(r.result);if(o.app!=='ts-backup'||!o.data||typeof o.data!=='object')throw 0}catch(e){toast('That file is not a TS backup.');return}
    var n=Object.keys(o.data).length;
    if(!confirm('Replace ALL current data with this backup ('+n+' items)? This cannot be undone.'))return;
    try{localStorage.clear();Object.keys(o.data).forEach(function(k){localStorage.setItem(k,String(o.data[k]))})}catch(e){toast('Restore failed.');return}
    toast('Restored. Reloading...');setTimeout(function(){try{parent.location.reload()}catch(e){location.reload()}},700);
  };
  r.readAsText(f);
}
async function testNotif(){
  var LN=plug('LocalNotifications');if(!LN){toast('Notifications only work in the installed app.');return}
  try{
    var p=await LN.checkPermissions();if(p.display!=='granted')p=await LN.requestPermissions();
    if(p.display!=='granted'){toast('Notifications are blocked. Allow them in Android settings for TS.');return}
    await LN.createChannel({id:'study',name:'Study reminders',importance:3});
    await LN.schedule({notifications:[{id:900002,title:'TS test',body:'Notifications are working.',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},channelId:'study'}]});
    toast('Test notification in 5 seconds. Lock the screen to check.');
  }catch(e){toast('Could not schedule the test.')}
}
function bind(){
  document.querySelectorAll('[data-min]').forEach(function(b){b.onclick=function(){var c=rd('hub.settings.v1')||{};c.studyMin=Number(b.dataset.min);localStorage.setItem('hub.settings.v1',JSON.stringify(c));render()}});
  var imp=document.getElementById('imp');if(imp)imp.onchange=function(){doImport(imp.files[0]);imp.value=''};
  document.querySelectorAll('[data-do]').forEach(function(b){b.onclick=function(){var d=b.dataset.do;if(d==='export')doExport();else if(d==='import')imp&&imp.click();else if(d==='notif')testNotif()}});
}
window.addEventListener('message',function(e){if(e.data&&e.data.hubRefresh)render()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
render();
})();
</script>
</body></html>
